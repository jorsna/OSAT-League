<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCSO OSAT League 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #f97316;
  --gold2: #fbbf24;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Montserrat', sans-serif;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Hjørner */
.corner {
  position: fixed;
  width: 36px; height: 36px;
  z-index: 10;
  pointer-events: none;
  opacity: 0.45;
}
.c-tl { top: 14px; left: 14px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.c-tr { top: 14px; right: 14px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.c-bl { bottom: 14px; left: 14px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.c-br { bottom: 14px; right: 14px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

.scanline {
  position: fixed; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(249,115,22,0.45), transparent);
  animation: scan 6s linear infinite;
  z-index: 10; pointer-events: none;
}
@keyframes scan {
  0%   { top: -2px; opacity: 0; }
  4%   { opacity: 1; }
  96%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* ── HOVED-LAYOUT: fast høyde = 100vh ── */
.scene {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  align-items: center;
  padding: 16px 20px 12px;
  gap: 6px;
}

/* ── TOPP: emblem + tittel ── */
.top-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  justify-self: center;
  opacity: 0;
  animation: fadeUp 0.9s ease forwards 0.2s;
}

.emblem-wrap {
  position: relative;
  width: 72px; height: 72px;
  margin-bottom: 6px;
  animation: emblemFloat 4s ease-in-out infinite;
}
@keyframes emblemFloat {
  0%,100% { filter: drop-shadow(0 0 14px rgba(249,115,22,0.55)); transform: translateY(0); }
  50%      { filter: drop-shadow(0 0 32px rgba(249,115,22,0.9)); transform: translateY(-4px); }
}
.e-ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(249,115,22,0.25);
  animation: ringPulse 3s ease-out infinite;
}
.e-ring:nth-child(1) { inset: -10px; animation-delay: 0s; }
.e-ring:nth-child(2) { inset: -22px; animation-delay: 1.1s; }
@keyframes ringPulse {
  0%   { opacity: 0.6; transform: scale(0.9); }
  100% { opacity: 0;   transform: scale(1.3); }
}
.e-circle {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.1), transparent 55%),
              linear-gradient(145deg, #1c0900, #080300);
  border: 1.5px solid rgba(249,115,22,0.55);
  display: flex; align-items: center; justify-content: center;
}

.vcso-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px, 1.6vw, 12px);
  font-weight: 700;
  letter-spacing: 6px;
  color: rgba(249,115,22,0.55);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 2px;
}

.main-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(42px, 10vw, 68px);
  letter-spacing: 10px;
  line-height: 1;
  color: rgba(255,255,255,0.18);
  text-align: center;
}

.osat-league {
  font-family: 'Anton', sans-serif;
  font-size: clamp(44px, 11vw, 88px);
  letter-spacing: clamp(6px, 2vw, 18px);
  line-height: 1;
  background: linear-gradient(150deg,
    #fff 0%, #f97316 18%, #fbbf24 40%, #f97316 60%, #fff 80%, #f97316 100%);
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 4.5s linear infinite;
  text-align: center;
  filter: drop-shadow(0 0 28px rgba(249,115,22,0.35));
}
@keyframes shine { to { background-position: 300% center; } }

/* ── MIDTBLOKK: avdelinger ── */
.avd-grid {
  width: 100%;
  max-width: 1200px;
  justify-self: center;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  align-items: start;
  padding: 0;
}

.avd-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.avd-name {
  font-family: 'Anton', sans-serif;
  font-size: clamp(10px, 2vw, 15px);
  letter-spacing: 4px;
  text-transform: uppercase;
  border-bottom: 2px solid;
  padding-bottom: 4px;
  width: 100%;
  text-align: center;
  margin-bottom: 2px;
  opacity: 0;
  animation: fadeUp 0.7s ease forwards;
}

/* Foto-grid innen avdeling */
.faces-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  align-items: flex-start;
}

/* Enkelt ansikt */
.face {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transform: translateY(18px) scale(0.88);
  transition: opacity 0.45s ease, transform 0.45s ease;
  cursor: default;
}
.face.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.face:hover .f-img {
  transform: scale(1.18) translateY(-3px);
  filter: grayscale(0%) !important;
  box-shadow: 0 0 0 2px var(--c), 0 6px 18px rgba(0,0,0,0.8);
}
.face:hover .f-name { opacity: 1; }

.f-img {
  border-radius: 50%;
  overflow: hidden;
  border: 1.5px solid var(--c);
  background: #111;
  transition: transform 0.3s, box-shadow 0.3s, filter 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.f-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top center;
  filter: grayscale(55%);
  transition: filter 0.3s;
}
.f-initials {
  font-family: 'Anton', sans-serif;
  color: var(--c);
}
.f-name {
  font-size: 6px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.65);
  text-align: center;
  text-transform: uppercase;
  line-height: 1.2;
  opacity: 0;
  transition: opacity 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── BUNN: badges + strip ── */
.bottom-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-self: center;
  gap: 6px;
  opacity: 0;
  animation: fadeUp 0.8s ease forwards 1.8s;
}

.badges-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.badge {
  border: 1px solid rgba(249,115,22,0.3);
  border-radius: 2px;
  padding: 5px 13px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(249,115,22,0.72);
  background: rgba(249,115,22,0.05);
  transition: all 0.3s;
}
.badge:hover {
  border-color: rgba(249,115,22,0.7);
  background: rgba(249,115,22,0.1);
  color: var(--gold);
}

.avd-strip {
  display: flex;
}
.strip-avd {
  padding: 6px 16px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  border-top: 2px solid;
}

.cta-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.cta-btn {
  font-family: 'Anton', sans-serif;
  font-size: clamp(13px, 2vw, 17px);
  letter-spacing: 4px;
  text-transform: uppercase;
  text-decoration: none;
  color: #0d0500;
  background: linear-gradient(135deg, #fbbf24, #f97316, #ea580c);
  padding: 14px 44px;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 28px rgba(249,115,22,0.45);
  animation: ctaPulse 2.5s ease-in-out infinite;
}
.cta-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 55px rgba(249,115,22,0.7);
  animation: none;
}
@keyframes ctaPulse {
  0%, 100% { box-shadow: 0 0 28px rgba(249,115,22,0.45); }
  50%       { box-shadow: 0 0 52px rgba(249,115,22,0.75); }
}

.cta-sub {
  font-size: 8px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.18);
  text-transform: uppercase;
}

.year-line {
  font-size: 8px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.18);
  text-transform: uppercase;
}

.tagline {
  font-size: clamp(14px, 2.2vw, 22px);
  font-weight: 300;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.55);
  text-align: center;
  margin-top: 8px;
  font-style: italic;
  line-height: 1.8;
}
.tagline-pts {
  font-style: normal;
  font-weight: 700;
  color: var(--gold);
  font-size: 1.15em;
  letter-spacing: 1px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>
<div class="scanline"></div>

<div class="scene">

  <!-- TOPP -->
  <div class="top-block">
    <div class="emblem-wrap">
      <div class="e-ring"></div>
      <div class="e-ring"></div>
      <div class="e-circle">
        <svg width="40" height="40" viewBox="0 0 68 68" fill="none">
          <path d="M34 9L42 27L62 21L49 41L54 57H14L19 41L6 21L26 27L34 9Z"
            fill="url(#cg)" stroke="rgba(249,115,22,0.15)" stroke-width="0.5"/>
          <rect x="29.5" y="55" width="9" height="5" rx="1" fill="rgba(249,115,22,0.5)"/>
          <rect x="25" y="59" width="18" height="4" rx="2" fill="rgba(249,115,22,0.6)"/>
          <circle cx="34" cy="9" r="3" fill="#fbbf24" opacity="0.9"/>
          <circle cx="6" cy="21" r="2.5" fill="#f97316" opacity="0.8"/>
          <circle cx="62" cy="21" r="2.5" fill="#f97316" opacity="0.8"/>
          <defs>
            <linearGradient id="cg" x1="6" y1="9" x2="62" y2="57" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fde68a"/>
              <stop offset="0.4" stop-color="#f97316"/>
              <stop offset="1" stop-color="#fbbf24"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>
    <div class="vcso-label">Volvo Car Stor Oslo &nbsp;·&nbsp; 2026</div>
    <div class="main-title">VCSO</div>
    <div class="osat-league">OSAT LEAGUE</div>
    <div class="tagline">
      Fornøyde kunder gir poeng. Poeng gir ære.<br>
      <span style="opacity:0.6;font-size:0.85em">38 deltakere · Fire avdelinger · 3 poeng for 9 og 10 på OSAT</span>
    </div>
  </div>

  <!-- AVDELINGER -->
  <div class="avd-grid" id="avd-grid"></div>

  <!-- BUNN -->
  <div class="bottom-block">
    <div class="badges-row">
      <div class="badge">👑 MVP</div>
      <div class="badge">🔥 Streak</div>
      <div class="badge">⭐ Hat Trick</div>
      <div class="badge">📞 Gulltelefon</div>
    </div>
    <div class="avd-strip">
      <div class="strip-avd" style="color:#fca5a5;border-color:#fca5a5;">Økern</div>
      <div class="strip-avd" style="color:#fde047;border-color:#fde047;">Ryen</div>
      <div class="strip-avd" style="color:#86efac;border-color:#86efac;">Lillestrøm</div>
      <div class="strip-avd" style="color:#93c5fd;border-color:#93c5fd;">Fornebu</div>
    </div>
    <div class="cta-wrap">
      <a class="cta-btn" href="https://jorsna.github.io/OSAT-League/" target="_blank">🏆 Klikk deg inn her</a>
      <div class="cta-sub">Starter i dag &nbsp;·&nbsp; Fire avdelinger &nbsp;·&nbsp; Ett trofé</div>
    </div>
  </div>

</div>

<script>
var AVDELINGER = [
  {
    id: 'okern', navn: 'Økern', color: '#fca5a5',
    selgere: [
      { id: 'ali_husseini',      navn: 'Ali Husseini' },
      { id: 'basil_omar',        navn: 'Basil Omar' },
      { id: 'emirhan_cimen',     navn: 'Emirhan Cimen' },
      { id: 'shezad_masih_azam', navn: 'Shezad M. Azam' }
    ]
  },
  {
    id: 'ryen', navn: 'Ryen', color: '#fde047',
    selgere: [
      { id: 'abdulghani_ajjan',          navn: 'Abdulghani Ajjan' },
      { id: 'algirdas_ambrozaitis',      navn: 'Algirdas A.' },
      { id: 'biniam_tesfamichael_tekle', navn: 'Biniam T. Tekle' },
      { id: 'elias_palacios',            navn: 'Elias Palacios' },
      { id: 'harvinder_singh_kular',     navn: 'Harvinder S. Kular' },
      { id: 'joel_andom_jiji',           navn: 'Joel Andom Jiji' },
      { id: 'kristoffer_langerud',       navn: 'Kristoffer L.' },
      { id: 'marco_bjornstad',           navn: 'Marco Bjørnstad' },
      { id: 'mohammad_yousaf_ahmed',     navn: 'M. Y. Ahmed' },
      { id: 'sindre_andre_tomte',        navn: 'Sindre A. Tømte' },
      { id: 'sipan_zewki',               navn: 'Sipan Zewki' },
      { id: 'vidar_flesvik',             navn: 'Vidar Flesvik' },
      { id: 'wajahit_elahit',            navn: 'Wajahit Elahit' }
    ]
  },
  {
    id: 'lillestrom', navn: 'Lillestrøm', color: '#86efac',
    selgere: [
      { id: 'aleksander_pettersen', navn: 'Aleksander P.' },
      { id: 'christopher_sjostrom', navn: 'Christopher S.' },
      { id: 'dennis_uggerud',       navn: 'Dennis Uggerud' },
      { id: 'george_xheki_hanelli', navn: 'George X. Hanelli' },
      { id: 'hedvig_oyen_larsen',   navn: 'Hedvig Ø. Larsen' },
      { id: 'john_arild_bergengen', navn: 'John A. Bergengen' },
      { id: 'jorn_sorensen',        navn: 'Jørn Sørensen' },
      { id: 'martin_pedersen',      navn: 'Martin Pedersen' },
      { id: 'pavel_jizba',          navn: 'Pavel Jizba' },
      { id: 'tom_kjetil_sandmoe',   navn: 'Tom K. Sandmoe' }
    ]
  },
  {
    id: 'fornebu', navn: 'Fornebu', color: '#93c5fd',
    selgere: [
      { id: 'aldahir_ramirez',             navn: 'Aldahir Ramirez' },
      { id: 'aras_fasal_omar',             navn: 'Aras Fasal Omar' },
      { id: 'bawar_faraj',                 navn: 'Bawar Faraj' },
      { id: 'brage_grammeltvedt_grefstad', navn: 'Brage Grefstad' },
      { id: 'gjermund_mauland',            navn: 'Gjermund Mauland' },
      { id: 'gohar_ehtisham',              navn: 'Gohar Ehtisham' },
      { id: 'kaniwar_nassan',              navn: 'Kaniwar Nassan' },
      { id: 'marek_zebrowski',             navn: 'Marek Zebrowski' },
      { id: 'mathuran_sandrakumar',        navn: 'Mathuran S.' },
      { id: 'mohammad_sirwan_salar',       navn: 'M. Sirwan Salar' },
      { id: 'moosa_butt',                  navn: 'Moosa Butt' }
    ]
  }
];

function initials(id) {
  return id.replace(/_/g,' ').split(' ')
    .map(function(w){ return w[0] ? w[0].toUpperCase() : ''; })
    .join('').slice(0,2);
}

// Beregn bildestørrelse dynamisk ut fra skjerm og antall PST
function calcSize() {
  var vh = window.innerHeight;
  var vw = window.innerWidth;
  var gridH = vh - 240;  // topp + bunn reservert
  var colW = (vw - 80) / 4;
  var maxCount = 0;
  AVDELINGER.forEach(function(a) { if (a.selgere.length > maxCount) maxCount = a.selgere.length; });
  // Maks 4 per rad i wrap
  var perRow = 4;
  var rows = Math.ceil(maxCount / perRow);
  var szFromH = Math.floor((gridH - rows * 14) / rows);
  var szFromW = Math.floor((colW - (perRow - 1) * 5) / perRow);
  return Math.max(Math.min(szFromH, szFromW, 56), 28);
}

var grid = document.getElementById('avd-grid');
var sz = calcSize();

AVDELINGER.forEach(function(avd, ai) {
  var col = document.createElement('div');
  col.className = 'avd-col';

  var nameEl = document.createElement('div');
  nameEl.className = 'avd-name';
  nameEl.style.color = avd.color;
  nameEl.style.borderColor = avd.color;
  nameEl.style.animationDelay = (0.55 + ai * 0.1) + 's';
  nameEl.textContent = avd.navn;
  col.appendChild(nameEl);

  var wrap = document.createElement('div');
  wrap.className = 'faces-wrap';

  avd.selgere.forEach(function(s) {
    var face = document.createElement('div');
    face.className = 'face';
    face.style.setProperty('--c', avd.color);

    var fImg = document.createElement('div');
    fImg.className = 'f-img';
    fImg.style.width = sz + 'px';
    fImg.style.height = sz + 'px';
    fImg.style.minWidth = sz + 'px';
    fImg.style.borderColor = avd.color;

    var img = document.createElement('img');
    img.src = 'photos/' + s.id + '.jpg';
    img.alt = s.navn;
    img.width = sz;
    img.height = sz;
    img.onerror = function() {
      fImg.innerHTML = '<div class="f-initials" style="color:' + avd.color + ';font-size:' + Math.round(sz * 0.3) + 'px">' + initials(s.id) + '</div>';
    };
    fImg.appendChild(img);

    var fName = document.createElement('div');
    fName.className = 'f-name';
    fName.style.maxWidth = (sz + 6) + 'px';
    fName.textContent = s.navn;

    face.appendChild(fImg);
    face.appendChild(fName);
    wrap.appendChild(face);
  });

  col.appendChild(wrap);
  grid.appendChild(col);
});

// Animer inn: kolonne for kolonne, ansikt for ansikt
setTimeout(function() {
  var cols = document.querySelectorAll('.avd-col');
  cols.forEach(function(col, ci) {
    var faces = col.querySelectorAll('.face');
    faces.forEach(function(face, fi) {
      setTimeout(function() {
        face.classList.add('visible');
      }, ci * 100 + fi * 55);
    });
  });
}, 950);

// ── CANVAS BAKGRUNN ──
(function() {
  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var pts = [];
  for (var i = 0; i < 90; i++) {
    pts.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3 - 0.1,
      r: Math.random() * 1.4 + 0.3,
      base: Math.random() * 0.45 + 0.08,
      tw: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.55 ? 0 : (Math.random() > 0.5 ? 1 : 2)
    });
  }
  var COLS = [[249,115,22],[251,191,36],[255,255,255]];

  (function draw() {
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    var gr = ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,H*0.7);
    gr.addColorStop(0,'rgba(249,115,22,0.07)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    pts.forEach(function(p) {
      p.x+=p.vx; p.y+=p.vy; p.tw+=0.038;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      var a=p.base*(0.5+0.5*Math.sin(p.tw)), c=COLS[p.hue];
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();
</script>
</body>
</html>
