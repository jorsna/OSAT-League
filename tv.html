<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>OSAT League · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  OSAT LEAGUE · TV-MODUS
  Storskjermside for verksted og infoskjermer. Kun lesing (anon-nøkkel), ingen innlogging.
  - Laget for 1920×1080, skalerer til alle skjermstørrelser (også 1280×720).
  - Henter scoringer hvert 60. sekund. Ved feil står siste data igjen.
  - Bytter visning selv: Tabellen → Avdelingene → I dag → Uka.
  - Holder skjermen våken (Screen Wake Lock, med usynlig video som reserve).
  - Laster seg selv inn på nytt hver natt kl. 04:30.
  - PST-liste, bilder, mestere og sesong hentes fra index.html, så TV-en aldri kommer ut av takt med appen.
  URL-valg:  ?scene=tabell,avdeling,idag,uka   (vis bare disse, i denne rekkefølgen)
             ?tid=20                          (sekunder per visning, standard 20)
             ?status=1                        (vis status for skjermlås og henting hele tiden)
             ?demo=1                          (vis en MÅL-grafikk etter 5 sekunder for test)
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#15110e;--bg2:#0f0c0a;--panel-a:#1f1915;--panel-b:#191410;
  --linje:rgba(255,237,213,.08);--linje2:rgba(255,237,213,.16);
  --txt:#fff4ea;--muted:#a8978a;--null:rgba(255,237,213,.30);
  --aksent:#f97316;--aksent-lys:#fdba74;--dyp:#c2410c;--ink:#1a0d04;--mester:#e8c66a;
  --okern:#fca5a5;--ryen:#fde047;--lillestrom:#86efac;--fornebu:#93c5fd;
  --f-disp:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --f-kond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-tekst:'Barlow',Arial,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg2);color:var(--txt);font-family:var(--f-tekst);cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 40% at 50% -8%,rgba(249,115,22,.16),transparent 65%),
    radial-gradient(ellipse 90% 40% at 50% 115%,rgba(249,115,22,.07),transparent 60%),
    linear-gradient(180deg,#1b1511 0%,#130f0c 55%,#0f0c0a 100%)}

/* ── TOPP ─────────────────────────────────────────── */
.topp{position:absolute;left:0;right:0;top:0;height:124px;display:flex;align-items:center;padding:0 60px;gap:48px;border-bottom:1px solid var(--linje)}
.merke{display:flex;align-items:baseline;gap:16px;white-space:nowrap}
.merke-o{font-family:var(--f-disp);font-size:64px;line-height:1;color:var(--aksent);letter-spacing:1px}
.merke-l{font-family:var(--f-disp);font-size:64px;line-height:1;color:var(--txt);letter-spacing:1px}
.merke-s{font-family:var(--f-kond);font-weight:700;font-size:26px;letter-spacing:3px;color:var(--aksent-lys);text-transform:uppercase;margin-left:6px}
.ses{flex:1;min-width:0}
.ses-t{font-family:var(--f-kond);font-weight:700;font-size:30px;letter-spacing:1px;color:var(--txt);margin-bottom:10px;white-space:nowrap}
.ses-t span{color:var(--muted);font-weight:600;margin-left:14px}
.ses-bar{display:flex;gap:6px;height:12px}
.ses-bar i{flex:1;background:var(--linje2);border-radius:2px}
.ses-bar i.f{background:var(--dyp)}
.ses-bar i.n{background:var(--aksent);box-shadow:0 0 14px rgba(249,115,22,.7)}
.klokke{text-align:right;white-space:nowrap}
#klokke{font-family:var(--f-disp);font-size:62px;line-height:1;color:var(--txt);letter-spacing:1px}
.oppd{font-family:var(--f-kond);font-weight:600;font-size:22px;color:var(--muted);margin-top:4px}
.oppd.feil{color:var(--aksent-lys)}

/* ── FANER ────────────────────────────────────────── */
.faner{position:absolute;left:60px;right:60px;top:140px;height:44px;display:flex;gap:10px}
.fane{flex:1;position:relative;font-family:var(--f-kond);font-weight:700;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;padding-left:2px;border-top:4px solid var(--linje2)}
.fane .fyll{position:absolute;left:0;top:-4px;height:4px;width:0;background:var(--aksent)}
.fane.on{color:var(--txt)}
.fane.ferdig .fyll{width:100%;background:var(--dyp)}

/* ── SCENER ───────────────────────────────────────── */
main{position:absolute;left:0;right:0;top:200px;height:796px}
.scene{position:absolute;inset:0;left:0;top:0;right:0;bottom:0;padding:0 60px;opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.scene.on{opacity:1;transform:none}
.panel{background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--linje);border-radius:18px}
.h-liten{font-family:var(--f-kond);font-weight:700;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:var(--aksent-lys)}
.tom{font-family:var(--f-kond);font-weight:600;font-size:30px;color:var(--muted);line-height:1.35}

/* Avatar */
.av{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--f-disp);border:3px solid transparent}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.05)}

/* Tabellen */
.tab-grid{display:grid;grid-template-columns:560px 1fr;gap:36px;height:100%}
.leder{position:relative;padding:40px 40px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.leder .h-liten{position:absolute;left:40px;top:40px}
.leder:before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--aksent)}
.leder .av{width:250px;height:250px;font-size:84px;margin:10px 0 22px;border-color:var(--aksent);box-shadow:0 0 0 8px rgba(249,115,22,.14),0 0 60px rgba(249,115,22,.25)}
.leder-navn{font-family:var(--f-kond);font-weight:800;font-size:52px;line-height:1.02;color:var(--txt)}
.leder-avd{font-family:var(--f-kond);font-weight:700;font-size:28px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
.leder-pts{font-family:var(--f-disp);font-size:150px;line-height:1;color:var(--aksent);margin-top:18px}
.leder-pts small{font-size:40px;color:var(--muted);margin-left:8px}
.leder-sub{font-family:var(--f-kond);font-weight:600;font-size:27px;color:var(--muted);margin-top:8px}
.leder-sub b{color:var(--txt)}
.leder-delt{font-family:var(--f-kond);font-weight:700;font-size:24px;color:var(--aksent-lys);margin-top:12px}
.liste{padding:18px 28px 14px;display:flex;flex-direction:column}
.liste-h,.rad{display:grid;grid-template-columns:70px 64px 84px 1fr 170px 120px 130px;align-items:center;column-gap:14px}
.liste-h{font-family:var(--f-kond);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:0 4px 10px;border-bottom:1px solid var(--linje2)}
.liste-h .hr{text-align:right}
.rad{height:66px;border-bottom:1px solid var(--linje);padding:0 4px}
.rad:last-child{border-bottom:0}
.rad .plass{font-family:var(--f-disp);font-size:40px;color:var(--muted);text-align:center}
.rad .plass.p2{color:#cbd5e1}.rad .plass.p3{color:#d9a066}
.rad .pil{font-family:var(--f-kond);font-weight:800;font-size:22px;text-align:center}
.pil.opp{color:#4ade80}.pil.ned{color:#f87171}
.rad .av{width:56px;height:56px;font-size:20px}
.rad .navn{min-width:0}
.rad .navn-n{font-family:var(--f-kond);font-weight:700;font-size:34px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rad .navn-a{font-family:var(--f-kond);font-weight:700;font-size:19px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.idag-merke{display:inline-block;margin-left:10px;padding:1px 9px;border-radius:999px;background:rgba(249,115,22,.16);border:1px solid rgba(249,115,22,.6);
  color:var(--aksent-lys);font-family:var(--f-kond);font-weight:800;font-size:20px;letter-spacing:1px;vertical-align:4px}
.form{display:flex;gap:9px;align-items:center}
.form i{width:20px;height:20px;border-radius:50%;border:2px solid var(--linje2)}
.form i.s{background:var(--aksent);border-color:var(--aksent)}
.rad .tiere{font-family:var(--f-disp);font-size:36px;text-align:right;color:var(--txt)}
.rad .pts{font-family:var(--f-disp);font-size:48px;text-align:right;color:var(--aksent)}
.liste-fot{font-family:var(--f-kond);font-weight:600;font-size:22px;color:var(--muted);margin-top:auto;padding-top:8px}

/* Avdelingene */
.avd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;height:100%}
.avd{position:relative;padding:34px 30px 30px;display:flex;flex-direction:column;overflow:hidden}
.avd .topp-strek{position:absolute;left:0;right:0;top:0;height:8px}
.avd-plass{font-family:var(--f-disp);font-size:96px;line-height:1;color:var(--muted)}
.avd.nr1 .avd-plass{color:var(--aksent)}
.avd-navn{font-family:var(--f-disp);font-size:58px;line-height:1.05;margin-top:10px;letter-spacing:.5px}
.avd-pst{font-family:var(--f-kond);font-weight:600;font-size:24px;color:var(--muted);margin-top:4px}
.avd-snitt{font-family:var(--f-disp);font-size:120px;line-height:1;color:var(--txt);margin-top:30px}
.avd-snitt-l{font-family:var(--f-kond);font-weight:700;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.avd-bar{height:12px;background:var(--linje2);border-radius:6px;overflow:hidden;margin:26px 0 24px}
.avd-bar i{display:block;height:100%;border-radius:6px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.avd-tall{display:grid;grid-template-columns:1fr 1fr;row-gap:16px;column-gap:10px}
.avd-tall div{font-family:var(--f-kond);font-weight:600;font-size:22px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.avd-tall b{display:block;font-family:var(--f-disp);font-weight:400;font-size:44px;color:var(--txt);letter-spacing:0;line-height:1.05}
.avd-topp{margin-top:auto;padding-top:18px;border-top:1px solid var(--linje2);font-family:var(--f-kond);font-weight:600;font-size:22px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.avd-topp b{display:block;font-weight:700;font-size:32px;color:var(--txt);letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* I dag */
.idag-grid{display:grid;grid-template-columns:640px 1fr;gap:36px;height:100%}
.mvp{position:relative;padding:36px 40px;display:flex;flex-direction:column;overflow:hidden}
.mvp:before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--aksent)}
.mvp-liste{display:flex;flex-direction:column;gap:26px;margin-top:30px}
.mvp-p{display:flex;align-items:center;gap:28px}
.mvp-p .av{width:170px;height:170px;font-size:58px;border-color:var(--aksent)}
.mvp-liste.flere .mvp-p .av{width:110px;height:110px;font-size:38px}
.mvp-n{font-family:var(--f-kond);font-weight:800;font-size:46px;line-height:1.05}
.mvp-liste.flere .mvp-n{font-size:36px}
.mvp-a{font-family:var(--f-kond);font-weight:700;font-size:24px;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.mvp-s{font-family:var(--f-kond);font-weight:600;font-size:26px;color:var(--muted);margin-top:8px}
.mvp-s b{color:var(--aksent);font-family:var(--f-disp);font-weight:400;font-size:34px}
.flere-idag{margin-top:34px;padding-top:22px;border-top:1px solid var(--linje2)}
.fi-r{display:flex;align-items:center;gap:16px;height:64px}
.fi-r .av{width:50px;height:50px;font-size:18px}
.fi-n{flex:1;font-family:var(--f-kond);font-weight:700;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-n small{font-size:18px;letter-spacing:2px;text-transform:uppercase;margin-left:10px}
.fi-p{font-family:var(--f-disp);font-size:34px;color:var(--aksent)}
.dagtall{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:24px;border-top:1px solid var(--linje2)}
.dagtall div{font-family:var(--f-kond);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.dagtall b{display:block;font-family:var(--f-disp);font-weight:400;font-size:64px;line-height:1.05;color:var(--txt);letter-spacing:0}
.hoyre{display:flex;flex-direction:column;gap:24px;min-height:0}
.siste{flex:1;padding:28px 34px 16px;min-height:0;overflow:hidden}
.s-rad{display:grid;grid-template-columns:150px 64px 1fr 110px 70px;align-items:center;column-gap:18px;height:72px;border-bottom:1px solid var(--linje)}
.s-rad:last-child{border-bottom:0}
.s-tid{font-family:var(--f-kond);font-weight:700;font-size:26px;color:var(--muted);white-space:nowrap}
.s-rad .av{width:56px;height:56px;font-size:20px}
.s-n{font-family:var(--f-kond);font-weight:700;font-size:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-n small{font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-left:12px}
.s-score{justify-self:end;width:72px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:36px;background:rgba(249,115,22,.14);color:var(--aksent-lys);border:2px solid rgba(249,115,22,.45)}
.s-score.ti{background:var(--aksent);color:var(--ink);border-color:var(--aksent)}
.s-fup{font-size:30px;text-align:center;opacity:.9}
.radar{padding:22px 34px;display:flex;align-items:center;gap:26px}
.radar-k{display:flex;align-items:center;gap:12px;font-family:var(--f-kond);font-weight:800;font-size:26px;letter-spacing:3px;color:var(--aksent)}
.radar-d{width:16px;height:16px;border-radius:50%;background:var(--aksent);box-shadow:0 0 0 0 rgba(249,115,22,.6);animation:puls 2s infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(249,115,22,.6)}70%{box-shadow:0 0 0 16px rgba(249,115,22,0)}100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}}
.radar-t{font-family:var(--f-kond);font-weight:600;font-size:28px;color:var(--txt);flex:1}
.radar-t b{color:var(--aksent-lys)}
.radar-n{font-family:var(--f-kond);font-weight:600;font-size:26px;color:var(--muted);text-align:right}
.radar-n b{color:var(--txt)}

/* Uka */
.uka-grid{display:grid;grid-template-columns:1fr 560px;gap:36px;height:100%}
.uka-tab{padding:28px 34px 18px}
.u-rad{display:grid;grid-template-columns:70px 80px 1fr 140px 150px;align-items:center;column-gap:16px;height:104px;border-bottom:1px solid var(--linje)}
.u-rad:last-child{border-bottom:0}
.u-rad .plass{font-family:var(--f-disp);font-size:56px;color:var(--muted);text-align:center}
.u-rad.r1 .plass{color:var(--aksent)}
.u-rad .av{width:76px;height:76px;font-size:26px}
.u-n{font-family:var(--f-kond);font-weight:700;font-size:42px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-a{font-family:var(--f-kond);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.u-tiere{font-family:var(--f-kond);font-weight:600;font-size:24px;color:var(--muted);text-align:right}
.u-tiere b{font-family:var(--f-disp);font-weight:400;font-size:38px;color:var(--txt);margin-right:6px}
.u-pts{font-family:var(--f-disp);font-size:64px;color:var(--aksent);text-align:right}
.uka-h{display:flex;flex-direction:column;gap:24px}
.utm{padding:28px 32px;position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column}
.utm .innhold{display:flex;align-items:center;gap:24px;margin-top:20px}
.utm .av{width:120px;height:120px;font-size:40px}
.utm.vinner .av{border-color:var(--mester);box-shadow:0 0 30px rgba(232,198,106,.3)}
.utm.tlf .av{border-color:var(--aksent)}
.utm-n{font-family:var(--f-kond);font-weight:800;font-size:40px;line-height:1.05}
.utm-a{font-family:var(--f-kond);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.utm-s{font-family:var(--f-kond);font-weight:600;font-size:24px;color:var(--muted);margin-top:8px}
.utm.vinner .h-liten{color:var(--mester)}
.utm .tom{font-size:28px;margin-top:18px}

/* ── TICKER ───────────────────────────────────────── */
.ticker{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:stretch;background:#100c0a;border-top:1px solid rgba(249,115,22,.28)}
.tk-l{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--aksent);color:var(--ink);font-family:var(--f-disp);font-size:30px;letter-spacing:2px}
.tk-l i{width:12px;height:12px;border-radius:50%;background:var(--ink);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.tk-spor{flex:1;overflow:hidden;position:relative}
.tk-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.tk-item{display:inline-flex;align-items:center;gap:14px;padding:0 44px 0 0;font-family:var(--f-kond);font-weight:600;font-size:30px;color:var(--txt)}
.tk-item:before{content:'';width:10px;height:10px;transform:rotate(45deg);background:var(--dyp);margin-right:30px}
.tk-k{font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--aksent-lys)}
.tk-d{color:var(--muted)}

/* ── MÅL ──────────────────────────────────────────── */
.maal{position:absolute;inset:0;left:0;top:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 55% 55% at 50% 45%,rgba(249,115,22,.28),rgba(249,115,22,0) 70%),#0d0a08;opacity:0;pointer-events:none;transition:opacity .45s ease}
.maal.on{opacity:1}
.maal-inn{display:flex;align-items:center;gap:70px;transform:scale(.9);transition:transform .6s cubic-bezier(.2,.9,.2,1.2)}
.maal.on .maal-inn{transform:scale(1)}
.maal .av{width:380px;height:380px;font-size:120px;border:8px solid var(--aksent);box-shadow:0 0 0 16px rgba(249,115,22,.16),0 0 120px rgba(249,115,22,.45)}
.maal-ord{font-family:var(--f-disp);font-size:230px;line-height:.9;color:var(--aksent);letter-spacing:4px;text-shadow:0 8px 60px rgba(249,115,22,.45)}
.maal-n{font-family:var(--f-kond);font-weight:800;font-size:76px;line-height:1.02;margin-top:14px}
.maal-a{font-family:var(--f-kond);font-weight:700;font-size:34px;letter-spacing:4px;text-transform:uppercase;margin-top:8px}
.maal-rad{display:flex;align-items:center;gap:22px;margin-top:30px;flex-wrap:wrap}
.maal-score{display:flex;align-items:baseline;gap:10px;padding:8px 26px;border-radius:16px;background:var(--aksent);color:var(--ink);font-family:var(--f-disp);font-size:78px;line-height:1.05}
.maal-score small{font-family:var(--f-kond);font-weight:800;font-size:30px;letter-spacing:2px}
.maal-pts{font-family:var(--f-disp);font-size:66px;color:var(--aksent-lys)}
.maal-ekstra{font-family:var(--f-kond);font-weight:700;font-size:34px;color:var(--txt);margin-top:22px}
.maal-ekstra span{display:inline-block;margin-right:14px;padding:4px 18px;border-radius:999px;border:2px solid rgba(249,115,22,.55);background:rgba(249,115,22,.12);color:var(--aksent-lys);font-size:28px;letter-spacing:1px;margin-bottom:8px}
.maal-samle{text-align:center}
.maal-samle .maal-ord{font-size:170px}
.maal-samle-t{font-family:var(--f-kond);font-weight:700;font-size:42px;color:var(--aksent-lys);letter-spacing:2px;text-transform:uppercase;margin-top:6px}

// Les PST-liste, bilder, mestere og sesong fra appen selv (index.html i samme repo)
function plukk(src, start, slutt) {
  var i = src.indexOf(start);
  if (i === -1) return null;
  var j = src.indexOf(slutt, i + start.length);
  if (j === -1) return null;

}
function lesFraAppen() {

    .then(function (src) {
      var raw = plukk(src, 'var SELGERE_RAW = [', '\n];');
      var foto = plukk(src, 'const SELGER_PHOTOS = {', '\n};');
      var ses = plukk(src, 'var SESONG = {', '\n};');
      var mes = /var MESTRE = (\[[^\n;]*\]);/.exec(src);
      var nyRaw = raw ? new Function('return ' + raw)() : null;
      if (nyRaw && nyRaw.length >= 10 && nyRaw[0].navn) SELGERE_RAW = nyRaw;
      var nyFoto = foto ? new Function('return ' + foto)() : null;
      if (nyFoto && typeof nyFoto === 'object') SELGER_PHOTOS = nyFoto;
      var nySes = ses ? new Function('return ' + ses)() : null;
      if (nySes && nySes.start && nySes.slutt) SESONG = nySes;
      var nyMes = mes ? new Function('return ' + mes[1])() : null;
      if (nyMes && nyMes.length) MESTRE = nyMes;
      KILDE_APP = true;
    })
    .catch(function (e) { KILDE_APP = false; console.warn('TV: bruker reservekopi av PST-listen (' + e.message + ')'); })
    .then(byggSelgere);
}

// ─── BEREGNINGER ─────────────────────────────────────────────
function tabell(filter) {
  var st = {};
  SELGERE.forEach(function (s) { st[s.navn] = { s: s, g: 0, pts: 0, tens: 0, fup: 0 }; });
  scores.forEach(function (r) {
    if (filter && !filter(r)) return;
    var p = st[r.pst]; if (!p) return;
    p.g++; p.pts += PTS;
    if (r.score === 10) p.tens++;
    if (r.fulgt_opp) p.fup++;
  });
  var rader = Object.keys(st).map(function (k) { return st[k]; });
  rader.sort(function (a, b) { return b.pts - a.pts || b.tens - a.tens || b.fup - a.fup || a.s.navn.localeCompare(b.s.navn, 'nb'); });
  // Delt plass når poeng, 10-ere og fulgt opp er like (som i appen)
  rader.forEach(function (r, i) {
    var f = rader[i - 1];
    r.plass = (i && f.pts === r.pts && f.tens === r.tens && f.fup === r.fup) ? f.plass : i + 1;
  });
  return rader;
}
function plasserIGaar() {
  var i = iDag(), ut = {};
  tabell(function (r) { return tsDato(r.ts) < i; }).forEach(function (r) { ut[r.s.navn] = r; });
  return ut;
}
function iDagPer() {
  var i = iDag(), ut = {};
  scores.forEach(function (r) { if (tsDato(r.ts) === i) ut[r.pst] = (ut[r.pst] || 0) + 1; });
  return ut;
}
function formDager(navn) {
  var i = iDag(), ut = [];
  for (var k = 4; k >= 0; k--) {
    var d = leggTil(i, -k), n = 0;
    scores.forEach(function (r) { if (r.pst === navn && tsDato(r.ts) === d) n++; });
    ut.push(n);
  }
  return ut;
}
function avdelinger() {
  var rader = TEAMS.map(function (id) {
    var medl = SELGERE.filter(function (s) { return s.loc === id; });
    var r = { id: id, navn: LL[id], color: LC[id], members: medl.length || 1, g: 0, pts: 0, tens: 0, fup: 0, scoret: 0, topp: null };
    var per = {};
    scores.forEach(function (x) {
      var s = PER_NAVN[x.pst]; if (!s || s.loc !== id) return;
      r.g++; r.pts += PTS; if (x.score === 10) r.tens++; if (x.fulgt_opp) r.fup++;
      per[x.pst] = per[x.pst] || { navn: x.pst, pts: 0, tens: 0 };
      per[x.pst].pts += PTS; if (x.score === 10) per[x.pst].tens++;
    });
    var liste = Object.keys(per).map(function (k) { return per[k]; });
    r.scoret = liste.length;
    liste.sort(function (a, b) { return b.pts - a.pts || b.tens - a.tens || a.navn.localeCompare(b.navn, 'nb'); });
    r.topp = liste[0] || null;
    r.pps = r.pts / r.members;
    return r;
  });
  rader.sort(function (a, b) { return b.pps - a.pps || b.pts - a.pts || b.tens - a.tens || b.fup - a.fup; });
  return rader;
}
function dagensMVP() {
  // Samme regel som MatchdayMVP i appen: poeng, så 10-ere; likt = delt
  var i = iDag(), per = {};
  scores.forEach(function (r) {
    if (tsDato(r.ts) !== i) return;
    per[r.pst] = per[r.pst] || { navn: r.pst, pts: 0, tens: 0, g: 0 };
    per[r.pst].pts += PTS; per[r.pst].g++; if (r.score === 10) per[r.pst].tens++;
  });
  var l = Object.keys(per).map(function (k) { return per[k]; });
  if (!l.length) return [];
  var maks = Math.max.apply(null, l.map(function (x) { return x.pts; }));
  var likt = l.filter(function (x) { return x.pts === maks; });
  var maksT = Math.max.apply(null, likt.map(function (x) { return x.tens; }));
  return likt.filter(function (x) { return x.tens === maksT; }).sort(function (a, b) { return a.navn.localeCompare(b.navn, 'nb'); });
}
function sesongUker() {
  var ut = [], sett = {}, d = SESONG.start;
  while (d <= SESONG.slutt) {
    var k = isoAar(d) + '-' + isoUke(d);
    if (!sett[k]) { sett[k] = 1; ut.push({ k: k, uke: isoUke(d) }); }
    d = leggTil(d, 1);
  }
  return ut;
}

// ─── RADAR (sist / neste sveip) ──────────────────────────────
function hMin(t) { return Date.UTC(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10), +t.slice(11, 13), +t.slice(14, 16)) / 60000; }
function hSlots(naa) {
  var ut = [], base = new Date(Date.UTC(+naa.slice(0, 4), +naa.slice(5, 7) - 1, +naa.slice(8, 10), 12));
  for (var i = -3; i <= 4; i++) {
    var d = new Date(base.getTime() + i * 86400000), dato = d.toISOString().slice(0, 10);
    (HENT_PLAN[d.getUTCDay()] || []).forEach(function (t) { ut.push(dato + ' ' + t); });
  }
  return ut.sort();
}
function hNar(t, naa) {
  var dag = t.slice(0, 10), dI = Math.round((hMin(dag + ' 12:00') - hMin(naa.slice(0, 10) + ' 12:00')) / 1440), kl = HENT_VIS[t.slice(11)] || t.slice(11);
  var w = new Date(Date.UTC(+dag.slice(0, 4), +dag.slice(5, 7) - 1, +dag.slice(8, 10), 12)).getUTCDay();
  return (dI === 0 ? 'i dag' : dI === 1 ? 'i morgen' : dI === -1 ? 'i går' : UKEDAG_L[w]) + ' ' + kl;
}
function osloFra(iso) {
  try {
    var p = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Oslo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
    p = p.replace(',', '').replace(/‎/g, '');
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(p)) return p.slice(0, 16);
  } catch (e) {}
  var d = new Date(iso);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function radarInfo() {
  var naa = osloNaa(), slots = hSlots(naa);
  var neste = slots.filter(function (t) { return t > naa; })[0] || null;
  var sist = hentLogg && hentLogg.length ? osloFra(hentLogg[0].tid) : null, nye = 0;
  if (sist) hentLogg.forEach(function (r) { if (hMin(sist) - hMin(osloFra(r.tid)) <= 20) nye += (r.nye || 0); });
  return { sist: sist ? hNar(sist, naa) : null, nye: nye, neste: neste ? hNar(neste, naa) : null };
}

// ─── TEGNING ─────────────────────────────────────────────────
function tegnAlt() {
  tegnTopp();
  tegnTabell();
  tegnAvdeling();
  tegnIdag();
  tegnUka();
  tegnTicker();
  tegnOppdatert();
}
function tegnTopp() {
  $('ses-navn').textContent = SESONG.navn || 'Sesong 3';
  var uker = sesongUker(), i = iDag(), k = isoAar(i) + '-' + isoUke(i), nr = 0;
  for (var x = 0; x < uker.length; x++) if (uker[x].k === k) nr = x + 1;
  var tekst;
  if (i < SESONG.start) tekst = (SESONG.navn || 'Sesongen') + ' starter ' + (SESONG.startTekst || SESONG.start);
  else if (i > SESONG.slutt) { tekst = (SESONG.navn || 'Sesongen') + ' er ferdigspilt'; nr = uker.length + 1; }
  else {
    var igjen = dagDiff(i, SESONG.slutt);
    tekst = 'Uke ' + nr + ' av ' + uker.length + '<span>' + (igjen === 0 ? 'Siste dag i sesongen' : igjen + ' dager igjen') + '</span>';
  }
  $('ses-t').innerHTML = tekst;
  $('ses-bar').innerHTML = uker.map(function (u, j) { return '<i class="' + (j + 1 < nr ? 'f' : j + 1 === nr ? 'n' : '') + '"></i>'; }).join('');
}
function tegnOppdatert() {
  var el = $('oppd');
  if (feilSiden && sistOK) { el.className = 'oppd feil'; el.textContent = 'Mistet kontakt – viser data fra ' + pad(sistOK.getHours()) + ':' + pad(sistOK.getMinutes()); }
  else if (feilSiden) { el.className = 'oppd feil'; el.textContent = 'Får ikke kontakt – prøver igjen'; }
  else if (sistOK) { el.className = 'oppd'; el.textContent = 'Sist oppdatert ' + pad(sistOK.getHours()) + ':' + pad(sistOK.getMinutes()); }
  oppdaterStatus();
}

function tegnTabell() {

  var scorere = rader.filter(function (r) { return r.pts > 0; });
  var el = $('sc-tabell');
  if (!scorere.length) {
    var m = MESTRE.length ? MESTRE[MESTRE.length - 1] : null, ms = m ? PER_NAVN[m.navn] || { navn: m.navn, short: m.navn, initials: m.navn.split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2), color: '#e8c66a', id: slug(m.navn) } : null;
    el.innerHTML = '<div class="tab-grid">'
      + '<div class="panel leder"><div class="h-liten">Tabellen</div>'
      + '<div class="leder-pts" style="font-size:120px;margin-top:120px">0<small>poeng</small></div>'
      + '<div class="tom" style="margin-top:20px">Ingen 9-ere eller 10-ere ennå.<br>Første scoring tar ledelsen.</div></div>'
      + '<div class="panel liste" style="justify-content:center;align-items:center;text-align:center">'
      + (ms ? avatar(ms, 'width:220px;height:220px;font-size:70px;border-color:var(--mester);box-shadow:0 0 50px rgba(232,198,106,.3)')
          + '<div class="h-liten" style="color:var(--mester);margin-top:26px">Regjerende mester · Sesong ' + m.sesong + '</div>'
          + '<div class="leder-navn" style="margin-top:8px">' + esc(m.navn) + '</div>'
          + '<div class="leder-sub">' + m.poeng + ' poeng</div>' : '')

    + avatar(l.s)
    + '<div class="leder-navn">' + esc(l.s.short) + '</div>'
    + '<div class="leder-avd" style="color:' + l.s.color + '">' + esc(LL[l.s.loc] || l.s.loc) + '</div>'
    + '<div class="leder-pts">' + l.pts + '<small>poeng</small></div>'

    + '</div><div class="panel liste"><div class="liste-h"><div>#</div><div></div><div></div><div>PST</div><div>Siste 5 dager</div><div class="hr">10-ere</div><div class="hr">Poeng</div></div>';

function tegnAvdeling() {
  var rader = avdelinger(), maks = 0;
  rader.forEach(function (r) { if (r.pps > maks) maks = r.pps; });
  var harPoeng = maks > 0, des = 1;
  rader.forEach(function (a, i) { rader.forEach(function (b, j) { if (i < j && a.pps !== b.pps && komma(a.pps) === komma(b.pps)) des = 2; }); });
  $('sc-avdeling').innerHTML = '<div class="avd-grid">' + rader.map(function (r, i) {
    var plass = harPoeng ? (i && rader[i - 1].pps === r.pps ? null : i + 1) : null;
    if (harPoeng && plass === null) { for (var k = i; k > 0 && rader[k - 1].pps === r.pps; k--); plass = k + 1; }
    var pct = harPoeng ? Math.round(r.pps / maks * 100) : 0;
    var topp = r.topp ? PER_NAVN[r.topp.navn] : null;
    return '<div class="panel avd' + (harPoeng && plass === 1 ? ' nr1' : '') + '"><div class="topp-strek" style="background:' + r.color + '"></div>'
      + '<div class="avd-plass">' + (harPoeng ? plass : '–') + '</div>'
      + '<div class="avd-navn" style="color:' + r.color + '">' + esc(r.navn) + '</div>'
      + '<div class="avd-pst">' + r.members + ' PST-er · ' + r.scoret + ' har scoret</div>'
      + '<div class="avd-snitt">' + (des === 2 ? r.pps.toFixed(2).replace('.', ',') : komma(r.pps)) + '</div>'
      + '<div class="avd-snitt-l">Poeng per PST</div>'
      + '<div class="avd-bar"><i style="width:' + pct + '%;background:' + r.color + '"></i></div>'
      + '<div class="avd-tall"><div>Poeng<b>' + r.pts + '</b></div><div>Scoringer<b>' + r.g + '</b></div><div>10-ere<b>' + r.tens + '</b></div><div>Fulgt opp<b>' + r.fup + '</b></div></div>'
      + '<div class="avd-topp">Toppscorer<b>' + (topp ? esc(topp.short) + ' · ' + r.topp.pts + ' p' : '–') + '</b></div>'
      + '</div>';

}

function tegnIdag() {
  var i = iDag(), mvp = dagensMVP();
  var dagens = scores.filter(function (r) { return tsDato(r.ts) === i; });
  var tiere = dagens.filter(function (r) { return r.score === 10; }).length, fup = dagens.filter(function (r) { return r.fulgt_opp; }).length;
  var venstre = '<div class="panel mvp"><div class="h-liten">' + (mvp.length > 1 ? 'Dagens MVP-er' : 'Dagens MVP') + '</div>';
  if (!mvp.length) venstre += '<div class="tom" style="margin-top:40px">Ingen 9-ere eller 10-ere i dag ennå.<br>Første scoring tar MVP-plassen.</div>';
  else venstre += '<div class="mvp-liste' + (mvp.length > 1 ? ' flere' : '') + '">' + mvp.slice(0, 3).map(function (m) {
    var s = PER_NAVN[m.navn];
    return '<div class="mvp-p">' + avatar(s) + '<div><div class="mvp-n">' + esc(s ? s.short : m.navn) + '</div>'
      + '<div class="mvp-a" style="color:' + (s ? s.color : '#a8978a') + '">' + esc(s ? LL[s.loc] : '') + '</div>'
      + '<div class="mvp-s"><b>' + m.pts + '</b> poeng · ' + m.g + ' scoring' + (m.g === 1 ? '' : 'er') + ' · ' + m.tens + ' tiere</div></div></div>';
  }).join('') + (mvp.length > 3 ? '<div class="tom">+ ' + (mvp.length - 3) + ' til</div>' : '') + '</div>';
  // Andre som har scoret i dag
  var mvpNavn = mvp.map(function (m) { return m.navn; }), andre = {};
  dagens.forEach(function (r) { if (mvpNavn.indexOf(r.pst) === -1) { andre[r.pst] = andre[r.pst] || { navn: r.pst, pts: 0, tens: 0 }; andre[r.pst].pts += PTS; if (r.score === 10) andre[r.pst].tens++; } });
  var al = Object.keys(andre).map(function (k) { return andre[k]; }).sort(function (a, b) { return b.pts - a.pts || b.tens - a.tens || a.navn.localeCompare(b.navn, 'nb'); });
  var plass = mvp.length > 1 ? 2 : 4;
  if (al.length && mvp.length <= 2) venstre += '<div class="flere-idag"><div class="h-liten" style="font-size:20px">Ogs\u00e5 p\u00e5 tavla i dag</div>' + al.slice(0, plass).map(function (a) {
    var s = PER_NAVN[a.navn];
    return '<div class="fi-r">' + avatar(s) + '<div class="fi-n">' + esc(s ? s.short : a.navn) + '<small style="color:' + (s ? s.color : '#a8978a') + '">' + esc(s ? LL[s.loc] : '') + '</small></div><div class="fi-p">+' + a.pts + '</div></div>';
  }).join('') + (al.length > plass ? '<div class="tom" style="font-size:22px;margin-top:6px">+ ' + (al.length - plass) + ' til</div>' : '') + '</div>';
  venstre += '<div class="dagtall"><div>I dag<b>' + dagens.length + '</b></div><div>10-ere<b>' + tiere + '</b></div><div>Fulgt opp<b>' + fup + '</b></div></div></div>';

  var siste = scores.slice().sort(function (a, b) { return a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : (b.id > a.id ? 1 : -1); }).slice(0, 7);
  var hoyre = '<div class="hoyre"><div class="panel siste"><div class="h-liten" style="margin-bottom:8px">Siste 9-ere og 10-ere</div>';
  if (!siste.length) hoyre += '<div class="tom" style="margin-top:20px">Radaren har ikke fanget noen 9-ere eller 10-ere i ' + esc(SESONG.navn || 'sesongen') + ' ennå.</div>';
  else hoyre += siste.map(function (r) {
    var s = PER_NAVN[r.pst], kl = tsKl(r.ts);
    return '<div class="s-rad"><div class="s-tid">' + dagTekst(tsDato(r.ts)) + (kl ? ' ' + kl : '') + '</div>' + avatar(s)
      + '<div class="s-n">' + esc(s ? s.short : r.pst) + '<small style="color:' + (s ? s.color : '#a8978a') + '">' + esc(s ? LL[s.loc] : '') + '</small></div>'
      + '<div class="s-score' + (r.score === 10 ? ' ti' : '') + '">' + r.score + '</div>'
      + '<div class="s-fup">' + (r.fulgt_opp ? '☎' : '') + '</div></div>';
  }).join('');
  hoyre += '</div>' + radarHtml() + '</div>';
  $('sc-idag').innerHTML = '<div class="idag-grid">' + venstre + hoyre + '</div>';
}
function radarHtml() {
  var r = radarInfo();
  return '<div class="panel radar"><div class="radar-k"><i class="radar-d"></i>RADAR</div>'
    + '<div class="radar-t">' + (r.sist ? 'Siste sveip <b>' + r.sist + '</b>' + (r.nye ? ' · fanget <b>' + r.nye + '</b> ny' + (r.nye === 1 ? '' : 'e') + ' 9/10' : '') : 'Radaren sveiper Medallia etter 9-ere og 10-ere') + '</div>'
    + (r.neste ? '<div class="radar-n">Neste sveip<br><b>' + r.neste + '</b></div>' : '') + '</div>';
}

function tegnUka() {
  var i = iDag(), man = mandag(i), uke = isoUke(i);
  var rader = tabell(function (r) { var d = tsDato(r.ts); return d >= man && d <= i; }).filter(function (r) { return r.pts > 0; });
  var v = '<div class="panel uka-tab"><div class="h-liten" style="margin-bottom:6px">Ukens tabell · uke ' + uke + '</div>';
  if (!rader.length) v += '<div class="tom" style="margin-top:20px">Ingen 9-ere eller 10-ere denne uken ennå.</div>';
  else v += rader.slice(0, 6).map(function (r) {
    return '<div class="u-rad' + (r.plass === 1 ? ' r1' : '') + '"><div class="plass">' + r.plass + '</div>' + avatar(r.s)
      + '<div><div class="u-n">' + esc(r.s.short) + '</div><div class="u-a" style="color:' + r.s.color + '">' + esc(LL[r.s.loc]) + '</div></div>'
      + '<div class="u-tiere"><b>' + r.tens + '</b>tiere</div><div class="u-pts">' + r.pts + '</div></div>';
  }).join('');
  v += '</div>';

  // Forrige ukesvinner (bare fra denne sesongen)
  var w = finn(ukesvinnere, function (x) { return x.week_end && x.week_end >= SESONG.start; });
  var h = '<div class="uka-h"><div class="panel utm vinner"><div class="h-liten">Forrige ukesvinner</div>';
  if (w) {
    var ws = PER_NAVN[w.pst] || { navn: w.pst, short: w.pst, initials: String(w.pst).split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2), color: LC[w.loc] || '#a8978a', id: slug(w.pst), loc: w.loc };
    h += '<div class="innhold">' + avatar(ws) + '<div><div class="utm-n">' + esc(ws.short) + '</div><div class="utm-a" style="color:' + ws.color + '">' + esc(LL[ws.loc] || ws.loc || '') + '</div>'
      + '<div class="utm-s">Uke ' + w.week_nr + ' · ' + (w.pts || 0) + ' poeng · ' + (w.tens || 0) + ' tiere</div></div></div>';
  } else h += '<div class="tom">Første ukesvinner i ' + esc(SESONG.navn || 'sesongen') + ' kåres mandag ' + (function () { var d = datoObj(leggTil(man, 7)); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; })() + ' kl. 12.</div>';
  h += '</div>';

  // Gulltelefonen denne uken: flest fulgt opp, deretter flest 10-ere
  var tlf = rader.filter(function (r) { return r.fup > 0; }).sort(function (a, b) { return b.fup - a.fup || b.tens - a.tens || a.s.navn.localeCompare(b.s.navn, 'nb'); });
  h += '<div class="panel utm tlf"><div class="h-liten">☎ Gulltelefonen · uke ' + uke + '</div>';
  if (tlf.length) {
    var t = tlf[0], delt = tlf.filter(function (r) { return r.fup === t.fup && r.tens === t.tens; }).length;
    h += '<div class="innhold">' + avatar(t.s) + '<div><div class="utm-n">' + esc(t.s.short) + '</div><div class="utm-a" style="color:' + t.s.color + '">' + esc(LL[t.s.loc]) + '</div>'
      + '<div class="utm-s">' + t.fup + ' fulgt opp' + (delt > 1 ? ' · delt med ' + (delt - 1) + ' til' : '') + '</div></div></div>';
  } else h += '<div class="tom">Ingen fulgt opp denne uken ennå. Flest oppfølginger tar telefonen.</div>';
  h += '</div></div>';
  $('sc-uka').innerHTML = '<div class="uka-grid">' + v + h + '</div>';
}

// ─── TICKER ──────────────────────────────────────────────────
var tickerSign = '';
function tegnTicker() {
  var items = [], r = radarInfo();
  items.push('<span class="tk-k">Radar</span>' + (r.sist ? 'Siste sveip ' + r.sist : 'Sveiper Medallia etter 9-ere og 10-ere') + (r.neste ? '<span class="tk-d">· neste ' + r.neste + '</span>' : ''));
  var siste = scores.slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; })[0];
  if (siste) { var s = PER_NAVN[siste.pst]; items.push('<span class="tk-k">Siste scoring</span>' + esc(s ? s.short : siste.pst) + ' · ' + siste.score + '<span class="tk-d">· ' + esc(s ? LL[s.loc] : '') + ' · ' + dagTekst(tsDato(siste.ts)).toLowerCase() + '</span>'); }
  if (gazzetta && gazzetta.overskrift) items.push('<span class="tk-k">La Gazzetta</span>' + esc(gazzetta.overskrift) + (gazzetta.ingress ? '<span class="tk-d">— ' + esc(gazzetta.ingress) + '</span>' : ''));
  var i = iDag();
  if (i >= SESONG.start && i <= SESONG.slutt) {
    var t = scores.filter(function (x) { return x.score === 10; }).length;
    items.push('<span class="tk-k">' + esc(SESONG.navn || 'Sesongen') + '</span>' + scores.length + ' scoringer · ' + t + ' tiere<span class="tk-d">· ' + dagDiff(i, SESONG.slutt) + ' dager igjen</span>');
  }
  var m = MESTRE.length ? MESTRE[MESTRE.length - 1] : null;
  if (m) items.push('<span class="tk-k">Regjerende mester</span>' + esc(m.navn) + '<span class="tk-d">· Sesong ' + m.sesong + ' · ' + m.poeng + ' poeng</span>');
  items.push('<span class="tk-k">Slik scorer du</span>Hver 9-er og 10-er fra kunden gir 3 poeng<span class="tk-d">· følg opp kunden og ta Gulltelefonen</span>');
  var html = items.map(function (x) { return '<span class="tk-item">' + x + '</span>'; }).join('');
  if (html === tickerSign) return;
  tickerSign = html;
  var track = $('tk-track');
  track.innerHTML = html + html;
  tickerStart();
}
var tkX = 0, tkW = 0, tkSist = 0;
function tickerStart() { tkW = $('tk-track').scrollWidth / 2; if (tkX <= -tkW) tkX = 0; }
function tickerSteg(t) {
  if (!tkSist) tkSist = t;
  var dt = Math.min(100, t - tkSist); tkSist = t;
  if (tkW > 0) { tkX -= dt * 0.09; if (tkX <= -tkW) tkX += tkW; $('tk-track').style.transform = 'translateX(' + Math.round(tkX) + 'px)'; }
  requestAnimationFrame(tickerSteg);
}

// ─── SCENEROTASJON ───────────────────────────────────────────
var sceneIdx = 0, sceneStart = 0, pauseTil = 0;
function byggFaner() {
  $('faner').innerHTML = SCENER.map(function (s) {
    return '<div class="fane" id="f-' + s + '"><span class="fyll"></span>' + $('sc-' + s).getAttribute('data-navn') + '</div>';
  }).join('');
  if (SCENER.length < 2) $('faner').style.visibility = 'hidden';
}
function visScene(i) {
  sceneIdx = (i + SCENER.length) % SCENER.length;
  ALLE_SCENER.forEach(function (s) { $('sc-' + s).className = 'scene' + (s === SCENER[sceneIdx] ? ' on' : ''); });
  SCENER.forEach(function (s, j) {
    var f = $('f-' + s); if (!f) return;
    f.className = 'fane' + (j === sceneIdx ? ' on' : j < sceneIdx ? ' ferdig' : '');
    f.firstChild.style.width = j < sceneIdx ? '100%' : '0';
  });
  sceneStart = Date.now();
}
function sceneTikk() {
  if (Date.now() < pauseTil) { sceneStart += 250; return; }
  var andel = (Date.now() - sceneStart) / (SCENE_SEK * 1000);
  var f = $('f-' + SCENER[sceneIdx]);
  if (f) f.firstChild.style.width = Math.min(100, andel * 100) + '%';
  if (andel >= 1 && SCENER.length > 1) visScene(sceneIdx + 1);
}

// ─── MÅL-GRAFIKK ─────────────────────────────────────────────
var maalKo = [], maalAktiv = false;
function visMaal(nye) {
  nye.sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
  if (nye.length >= 3) maalKo.push({ samle: nye });
  else nye.forEach(function (r) { maalKo.push({ r: r }); });
  if (!maalAktiv) nesteMaal();
}
function nesteMaal() {
  var x = maalKo.shift(), el = $('maal');
  if (!x) { maalAktiv = false; el.className = 'maal'; return; }
  maalAktiv = true;
  var sek = x.samle ? 12 : 8;
  el.innerHTML = x.samle ? maalSamleHtml(x.samle) : maalHtml(x.r);
  el.className = 'maal';
  void el.offsetWidth;
  el.className = 'maal on';
  pauseTil = Date.now() + sek * 1000 + 600;
  setTimeout(function () {
    el.className = 'maal';
    setTimeout(nesteMaal, 700);
  }, sek * 1000);
}
function maalHtml(r) {
  var s = PER_NAVN[r.pst], rader = tabell(), meg = finn(rader, function (x) { return x.s.navn === r.pst; });
  var nIdag = 0, i = iDag();
  scores.forEach(function (x) { if (x.pst === r.pst && tsDato(x.ts) === i) nIdag++; });
  var ekstra = [];
  if (meg) ekstra.push('Nå ' + meg.plass + '. plass · ' + meg.pts + ' poeng');
  if (tsDato(r.ts) === i && nIdag >= 3) ekstra.push('Hat-trick i dag!');
  else if (tsDato(r.ts) === i && nIdag === 2) ekstra.push('Ett svar til i dag = hat-trick');
  if (r.fulgt_opp) ekstra.push('☎ Fulgt opp');
  return '<div class="maal-inn">' + avatar(s) + '<div><div class="maal-ord">MÅL!</div>'
    + '<div class="maal-n">' + esc(s ? s.navn : r.pst) + '</div>'
    + '<div class="maal-a" style="color:' + (s ? s.color : '#a8978a') + '">' + esc(s ? LL[s.loc] : '') + '</div>'
    + '<div class="maal-rad"><div class="maal-score">' + r.score + '<small>AV 10</small></div><div class="maal-pts">+' + PTS + ' poeng</div></div>'
    + '<div class="maal-ekstra">' + ekstra.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div></div></div>';
}
function maalSamleHtml(liste) {
  var per = {}, rekke = [];
  liste.forEach(function (r) {
    if (!per[r.pst]) { per[r.pst] = { navn: r.pst, n: 0, tens: 0 }; rekke.push(per[r.pst]); }
    per[r.pst].n++; if (r.score === 10) per[r.pst].tens++;
  });
  rekke.sort(function (a, b) { return b.n - a.n || b.tens - a.tens || a.navn.localeCompare(b.navn, 'nb'); });
  var vis = rekke.slice(0, 8);
  return '<div class="maal-samle"><div class="maal-ord">MÅL!</div><div class="maal-samle-t">Radaren fanget ' + liste.length + ' nye 9-ere og 10-ere</div>'
    + '<div class="maal-samle-l">' + vis.map(function (p) {
      var s = PER_NAVN[p.navn];
      return '<div class="ms-p">' + avatar(s) + '<div><div class="ms-n">' + esc(s ? s.short : p.navn) + '</div><div class="ms-s"><span style="color:' + (s ? s.color : '#a8978a') + '">' + esc(s ? LL[s.loc] : '') + '</span> · +' + (p.n * PTS) + ' poeng' + (p.tens ? ' · ' + p.tens + ' tier' + (p.tens === 1 ? '' : 'e') : '') + '</div></div></div>';
    }).join('') + '</div>' + (rekke.length > 8 ? '<div class="maal-samle-t" style="margin-top:30px;font-size:30px">+ ' + (rekke.length - 8) + ' PST-er til</div>' : '') + '</div>';
}

// ─── HOLD SKJERMEN VÅKEN ─────────────────────────────────────
var vaken = { metode: 'starter', lock: null };
function beWakeLock() {
  if (!('wakeLock' in navigator) || !navigator.wakeLock || !navigator.wakeLock.request) { startVideo('Wake Lock støttes ikke'); return; }
  navigator.wakeLock.request('screen').then(function (l) {
    vaken.lock = l; vaken.metode = 'Wake Lock'; oppdaterStatus();
    l.addEventListener('release', function () { vaken.lock = null; if (!document.hidden) setTimeout(beWakeLock, 1000); });
  }).catch(function (e) { startVideo('Wake Lock avvist: ' + (e && e.name || e)); });
}
function startVideo(grunn) {
  var v = $('wake-video');
  if (!v || !v.play) { vaken.metode = 'ikke støttet'; oppdaterStatus(); return; }
  try {
    var p = v.play();
    if (p && p.then) p.then(function () { vaken.metode = 'video'; oppdaterStatus(); }).catch(function () { vaken.metode = 'venter på trykk'; oppdaterStatus(); });
    else { vaken.metode = 'video'; oppdaterStatus(); }
  } catch (e) { vaken.metode = 'ikke støttet'; oppdaterStatus(); }
  if (grunn) console.info('TV: ' + grunn + ' – bruker video');
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && !vaken.lock && vaken.metode !== 'video') beWakeLock(); });
// Trykk/klikk: fullskjerm og ny sjanse for skjermlås
function aktiver() {
  var d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
  if (fs && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { var p = fs.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  if (!vaken.lock) beWakeLock();
  if (vaken.metode !== 'Wake Lock') startVideo();
  visStatus(8000);
}
document.addEventListener('click', aktiver);
document.addEventListener('touchend', aktiver);
document.addEventListener('keydown', function (e) {
  var k = e.key || e.keyCode;
  if (k === 'ArrowRight' || k === 39) visScene(sceneIdx + 1);
  else if (k === 'ArrowLeft' || k === 37) visScene(sceneIdx - 1);
  else if (k === 'f' || k === 70 || k === 'Enter' || k === 13) aktiver();
});

// Status nederst til høyre (vises 25 sek etter start, eller alltid med ?status=1)
var statusTil = 0;
function visStatus(ms) { statusTil = Date.now() + ms; oppdaterStatus(); }
function oppdaterStatus() {
  var el = $('status'); if (!el) return;
  el.innerHTML = 'Skjerm holdes våken: <b>' + vaken.metode + '</b> · PST-liste: <b>' + (KILDE_APP ? 'fra appen' : 'reservekopi') + '</b> · Data: <b>' + (sistOK ? (feilSiden ? 'feil' : 'ok') : '…') + '</b>';
  el.className = 'status' + (VIS_STATUS || Date.now() < statusTil ? '' : ' skjult');
}

// ─── SKALERING OG INNBRENNINGSVERN ───────────────────────────
var skift = 0;
function tilpass() {
  var w = window.innerWidth, h = window.innerHeight, s = Math.min(w / 1920, h / 1080);
  var x = (w - 1920 * s) / 2, y = (h - 1080 * s) / 2;
  var dx = [0, 2, 0, -2][skift % 4], dy = [0, 0, 2, 0][skift % 4];
  $('stage').style.transform = 'translate(' + Math.round(x + dx) + 'px,' + Math.round(y + dy) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', tilpass);

// ─── KLOKKE OG NATTLIG OMSTART ───────────────────────────────
var startetDag = iDag();
function klokke() {
  var n = osloNaa();
  $('klokke').textContent = n.slice(11, 16);
  if (n.slice(11, 16) >= NATT_RELOAD && n.slice(0, 10) !== startetDag && n.slice(11, 13) < '06') {
    // Bare last på nytt hvis nettet virker – ellers ville skjermen bli stående med en feilside
    fetch(location.pathname + '?sjekk=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (r.ok) location.reload();
    }).catch(function () {});
    startetDag = n.slice(0, 10);
  }
}

// ─── START ───────────────────────────────────────────────────
tilpass();
klokke();
setInterval(klokke, 15000);
lesFraAppen().then(function () {
  byggFaner();
  tegnAlt();
  visScene(0);
  return Promise.all([hentScores(), hentUkesvinnere(), hentGazzetta(), hentRadar()]);
}).then(function () { tegnAlt(); });
setInterval(hentScores, HENT_SEK * 1000);
setInterval(function () { hentUkesvinnere(); hentGazzetta(); }, 10 * 60000);
setInterval(function () { hentRadar().then(function () { tegnIdag(); tegnTicker(); }); }, 5 * 60000);
setInterval(function () { tegnTopp(); tegnIdag(); }, 60000);
setInterval(sceneTikk, 250);
setInterval(function () { skift++; tilpass(); }, 10 * 60000);
requestAnimationFrame(tickerSteg);
beWakeLock();
visStatus(25000);
setInterval(oppdaterStatus, 5000);
if (param('demo') === '1') setTimeout(function () {
  var r = scores[0] || (SELGERE[0] && { id: 'demo', pst: SELGERE[0].navn, score: 10, ts: iDag() + 'T12:00:00', fulgt_opp: true });
  if (r) visMaal([r]);
}, 5000);
// For testing fra konsollen
window.OSAT_TV = { hent: hentScores, visMaal: visMaal, visScene: visScene, data: function () { return { scores: scores, ukesvinnere: ukesvinnere, gazzetta: gazzetta, hentLogg: hentLogg }; } };
})();
</script>
